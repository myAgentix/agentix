[project]
name = "agentix"
version = "0.7.1"
description = "Agentix — the reusable, app-agnostic agent kernel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "LicenseRef-BSL-1.1" }
authors = [{ name = "euroblaze" }]

# Kernel runtime deps — intrinsic core only. Vendor SDKs are opt-in extras (see below).
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
# Intrinsic extras (open-source infra, no commercial API ToS)
minio      = ["minio>=7.2"]
hf         = ["huggingface_hub>=0.24"]
postgresql = ["asyncpg>=0.29"]

# OpenAI-compatible wire (nvidia, melious). The `openai` SDK is
# pulled in purely as the HTTP client for that wire format — the kernel ships no
# first-party commercial provider driver. See docs/vendor-licenses.md for the
# endpoint ToS each consumer accepts independently.
openai-compat = ["openai>=1.55"]

# CLI operational tooling
cli = ["typer>=0.12", "rich>=13", "aiosqlite>=0.20"]

# Daemon + SDK
daemon = ["fastapi>=0.115", "uvicorn>=0.30", "pyyaml>=6.0"]
sdk    = ["httpx>=0.27"]

# Convenience bundles
broker        = ["nats-py>=2.6"]
all-intrinsic = ["agentix[minio,hf,postgresql]"]
all           = ["agentix[all-intrinsic,openai-compat,broker,cli,daemon,sdk]"]

[project.scripts]
agentix  = "agentix_cli.main:app"
agentixd = "agentixd.main:run"

[project.urls]
Repository = "https://github.com/euroblaze/agentix"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# Kernel + CLI only. libs/ (ludo_shared/ludo_internal) are cluster vendoring
# machinery — canonical here, consumed by consumers vendoring them, never in wheel.
include = ["agentix*", "agentix_cli*", "agentixd*", "agentix_sdk*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    # PINNED, not a floor: ruff's formatter and lint rules change between
    # releases, and there is no uv.lock here — so an unpinned range lets an
    # upstream release turn CI red with no code change (that is how main went
    # red on 2026-07-27 and stayed red for eight days). Bump this deliberately,
    # in its own PR, so the reformat is reviewable.
    "ruff==0.16.0",
    "mypy>=1.13",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "libs"]
# Canonical wire-contract packages are generated + drift-checked, not re-formatted here.
extend-exclude = ["libs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ASYNC240"]
# typer's design requires calling typer.Option/Argument in function defaults (B008)
"src/agentix_cli/**/*.py" = ["B008"]
# agentixd's entrypoint is a typer command too — same constraint.
"src/agentixd/main.py" = ["B008"]
# Spike-harness primitives deliberately use blocking pathlib + simple try/except.
"src/agentix/tools/spike/apply_patch.py" = ["ASYNC240"]
"src/agentix/tools/spike/run_command.py" = ["SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src:libs/python:libs/internal"

[[tool.mypy.overrides]]
module = ["minio.*", "frontmatter.*", "nats.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "libs/python", "libs/internal"]
markers = [
    "integration: tests that require live MinIO/SQLite or a provider key",
    "stress: long-running concurrency / failure-mode stress tests",
]

[tool.coverage.run]
source = ["src/agentix"]
branch = true

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
